name: Release

# A tag is the only thing that can produce a release, and it must agree with the
# version in the project file. That way the number in the footer, the number in
# the file name, and the number on the release page cannot drift apart.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v0.7.0); must already exist"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish self-contained build
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Read the version this tag claims
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }

          [xml]$project = Get-Content -LiteralPath 'src/Mimi.App/Mimi.App.csproj'
          $version = ($project.Project.PropertyGroup.Version | Where-Object { $_ }) -join ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Mimi.App.csproj has no <Version>; a release cannot be named.'
          }

          $expected = "v$version"
          if ($tag -ne $expected) {
            throw "Tag '$tag' does not match the project version '$expected'."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing $tag"

      - name: Restore, build and test
        run: |
          dotnet restore Mimi.sln
          dotnet build Mimi.sln --configuration Release --no-restore
          dotnet test tests/Mimi.Tests/Mimi.Tests.csproj --configuration Release --no-build

      # Self-contained and *not* single-file: TagLibSharp is LGPL-2.1 and has to
      # stay a replaceable assembly next to the executable (see
      # THIRD-PARTY-NOTICES.md).
      - name: Publish win-x64
        shell: pwsh
        run: |
          dotnet publish src/Mimi.App/Mimi.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o publish/win-x64

      - name: Package the portable folder
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $folder = "Mimi-$tag-win-x64"

          # The notices and the licence travel with the binaries: MIT requires
          # the notice, and LGPL requires the credit and the licence text.
          # SECURITY.md travels too: the installer's before-install page points
          # the reader at it, so it has to actually be there.
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, CHANGELOG.md, SECURITY.md `
            -Destination publish/win-x64

          Rename-Item -LiteralPath publish/win-x64 -NewName $folder
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "publish/$folder" -DestinationPath "dist/$folder.zip"

          "asset=dist/$folder.zip" >> $env:GITHUB_OUTPUT
        id: package

      # The installer packages the same folder the zip contains, so the two
      # downloads cannot contain different builds.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            Write-Host 'Inno Setup was not on the image; installing it.'
            choco install innosetup --no-progress -y
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw 'ISCC.exe was not found even after installing Inno Setup.'
          }

          # The previous step renamed the publish folder to the release name,
          # so the installer packages exactly the folder the zip contains.
          $folder = "Mimi-${{ steps.version.outputs.tag }}-win-x64"
          $source = (Resolve-Path "publish/$folder").Path

          & $iscc `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceDir=$source" `
            installer/Mimi.iss
          if ($LASTEXITCODE -ne 0) { throw 'The installer script did not compile.' }

          $setup = Get-ChildItem dist -Filter '*Setup.exe' | Select-Object -First 1
          if ($null -eq $setup) { throw 'No setup file was produced.' }
          "$($setup.FullName)" | Out-File -FilePath dist/setup-path.txt -Encoding ascii

      - name: Write checksums
        shell: pwsh
        run: |
          # A download nobody can verify is a download you have to trust. The
          # format is what sha256sum -c expects, so it works on every platform.
          $files = Get-ChildItem dist -File |
            Where-Object { $_.Extension -in '.zip', '.exe' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }

          # Written by hand rather than with Set-Content: that appends CRLF, and
          # "sha256sum -c" then looks for a file name ending in a carriage return.
          # LF endings, no BOM, exactly what the tool expects.
          $sums = Join-Path (Get-Location) 'dist/SHA256SUMS.txt'
          [System.IO.File]::WriteAllText(
            $sums,
            (($lines -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false))
          Get-Content -LiteralPath $sums | Write-Host

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Mimi-${{ steps.version.outputs.tag }}-win-x64
          path: |
            dist/*.zip
            dist/*Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # The release body is written by a human, not generated: it is the one place
      # where the download table, the SmartScreen warning and the list of what is
      # still unfinished are said in full. The script only rewrites the image and
      # repository links so they resolve on a release page.
      - name: Render the release notes
        shell: pwsh
        run: |
          ./tools/release-art/render_release_notes.ps1 `
            -Tag '${{ steps.version.outputs.tag }}' `
            -Version '${{ steps.version.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { throw 'Could not render the release notes.' }

      - name: Create or update the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $asset = '${{ steps.package.outputs.asset }}'
          $notes = 'dist/release-notes.md'

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Mimi $tag" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag." }
          }
          else {
            # Re-running the workflow must not silently keep an older body.
            gh release edit $tag --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Could not update release $tag." }
          }

          $setup = (Get-Content -LiteralPath dist/setup-path.txt -Raw).Trim()
          gh release upload $tag $asset $setup dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the release files." }
