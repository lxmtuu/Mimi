name: Windows build

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Release)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore Mimi.sln

      - name: Build solution
        run: dotnet build Mimi.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Mimi.Tests/Mimi.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=mimi-tests.trx" --results-directory TestResults

      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $trx) { return }
          [xml]$document = Get-Content -LiteralPath $trx.FullName
          $namespaces = New-Object System.Xml.XmlNamespaceManager($document.NameTable)
          $namespaces.AddNamespace(
            "t",
            "http://microsoft.com/schemas/VisualStudio/TeamTest/2010")
          $failed = $document.SelectNodes(
            "//t:UnitTestResult[@outcome='Failed']",
            $namespaces)
          foreach ($result in $failed) {
            $name = $result.GetAttribute("testName")
            $messageNode = $result.SelectSingleNode(".//t:Message", $namespaces)
            $message = if ($null -ne $messageNode) {
              $messageNode.InnerText -replace "%", "%25" -replace "[\r\n]+", " "
            } else {
              "No failure message"
            }
            Write-Host "::error title=Failed test::$name -- $message"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Mimi-test-results-${{ github.sha }}
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build output
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Mimi-${{ github.sha }}
          path: src/Mimi.App/bin/Release/net8.0-windows10.0.19041/**
          if-no-files-found: error
          retention-days: 14
